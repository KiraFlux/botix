# PRE-ASSEMBLIES GUIDES

uno_pre_asm(uno_r3):
  "00":
    add:
      - screw_csk_m3x20@4
    side: top
  
  "01":
    add:
      - bushing_m3x6@4
    side: bottom


esp32_expansion_board_pre_asm(esp32_expansion_board):
  "00":
    add:
      - screw_csk_m3x20@4
    side: top

  "01":
    add:
      - bushing_m3x6@4
    side: bottom


drv8871_module_pre_asm(drv8871_module):
  "00":
    add:
      - screw_pan_m3x10@1
    side: top

  "01":
    add:
      - bushing_m3x2@1
    side: bottom


botix_power_v2_pre_asm_4(botix_power_v2):
  "00":
    add:
      - screw_csk_m3x20@4
    side: front
    to: corner holes

  "01":
    add:
      - bushing_m3x6@4
    side: opposite


botix_power_v2_pre_asm_2(botix_power_v2):
  "00":
    add:
      - screw_csk_m3x20@2
    side: front
    to: middle holes

  "01":
    add:
      - bushing_m3x6@2
    side: opposite


# ATTACHMENT GUIDES

felt_support_asm(felt_support):
  "00":
    add:
      - felt@1

  "01":
    add:
      - nut_hex_m3@2


sharp_asm(sharp_mount):
  "00":
    add:
      - nut_hex_m3@3

  "01":
    add:
      - sharp_gp2y0a41sk0f@1
      - screw_pan_m3x10@2


hcsr04_asm(hcsr04_mount):
  "00":
    add:
      - nut_hex_m3@1
  
  "01":
    add:
      - hcsr04@1


mg996r_joint_asm(mg996r_joint_mount):
  "00":
    add:
      - nut_hex_m3@4

  "01":
    add:
      - mg996r@1
      - screw_pan_m3x10@2
    note: |
      Set servo to 180 deg.

  "02":
    add:
      - horn_6arm@1
    note: |
      Align splines: two opposite arms at the same height.

  "03":
    add:
      - mg996r_joint_link@1
      - screw_pan_m3x10@1


# CHASSIS SUBASSEMBLIES GUIDES

platform_asm(platform):
  "00":
    add:
      - felt_support_asm@1
      - screw_pan_m3x10@2
    side: bottom
    to: front felt support
    note: |
      Screw head pockets must be visible on this side.

  "01":
    add:
      - frame_asm@2
    to: front slots

  "02":
    add:
      - screw_csk_m3x8@2


platform_asm_for_advanced(platform_asm):
  "00":
    add:
      - felt_support_asm@1
      - screw_pan_m3x10@2
    to: rear felt support

  "01":
    add:
      - botix_power_v2_pre_asm_2@1
      - nut_hex_m3@2
      - washer_m3@2
    to: rear top
    note: |
      Use washers.


deck_asm_uno(deck):
  "00":
    add:
      - uno_pre_asm@1
      - nut_hex_m3@4

  "01":
    add:
      - iarduino_motor_shield@1


deck_asm_esp32(deck):
  "00":
    add:
      - esp32_expansion_board_pre_asm@1
      - nut_hex_m3@4

  "01":
    add:
      - esp32@1

  "02":
    add:
      - drv8871_module_pre_asm@2
      - nut_hex_m3@2


frame_asm(frame):
  "00":
    add:
      - nut_hex_m3@2
    note: |
      Both nuts must lie on the same imaginary axis.


side_wall_asm(side_wall):
  "00":
    add:
      - nut_hex_m3@3

  "01":
    add:
      - jga25@1
      - screw_csk_m3x8@2
    note: |
      Motor connector faces away from the wall opening
      (toward the end where the wall terminates sooner).

  "02":
    add:
      - hex_coupler_m4x18@1
      - screw_set_m4x4@1
    note: |
      Set screw axis perpendicular to the D-cut on the motor shaft.

  "03":
    add:
      - wheel_rc_d52@1
      - screw_pan_m4x8@1


rear_wall_asm(rear_wall):
  "00":
    add:
      - botix_power_v2_pre_asm_4@1
      - nut_hex_m3@1


# BOTIX ROBOT ASSEMBLES VARIANT GUIDES

botix_basic(rear_wall_asm):
  "00":
    add:
      - side_wall_asm@2
    note: |
      Left and right side walls, mirrored.

  "01":
    add:
      - screw_csk_m3x8@2
  
  "02":
    add:
      - platform_asm@1

  "03":
    add:
      - screw_csk_m3x8@5

  "04":
    add:
      - felt_support_asm@1
      - screw_pan_m3x10@2
    to: rear

  "05":
    add:
      - deck_asm_uno@1

  "06":
    add:
      - screw_csk_m3x8@4

  "07":
    add:
      - wire_power@1
    to: motor_shield

  "08":
    add:
      - wire_jga25@2
    to: motor_shield

  "09":
    add:
      - iarduino_tcrt5000@2
      - nut_hex_m3@2
      - screw_pan_m3x10@2
  
  "10":
    add:
      - wire_dupont_3p@2
    to: analog_ports

  "11":
    add:
      - sharp_asm@1
      - screw_pan_m3x10@1

  "12":
    add:
      - wire_jst_3p@1
    to: analog_port


botix_advanced(platform_asm_for_advanced):
  "00":
    add:
      - side_wall_asm@2
    note: |
      Left and right side walls, mirrored.

  "01":
    add:
      - screw_csk_m3x8@2
  
  "02":
    add:
      - deck_asm_esp32@1
  
  "03":
    add:
      - screw_csk_m3x8@4
  
  "04":
    add:
      - wire_power@1
    to: motor_drivers

  "05":
    add:
      - wire_jga25@2
    to: motor_drivers
